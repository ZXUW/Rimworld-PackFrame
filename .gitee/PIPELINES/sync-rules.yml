version: '1.0'
name: sync-rimsort-dbs
displayName: Sync RimSort Databases
triggers:
  schedule:
    - cron: '0 25 12 * * ? *'
  push:
    branches:
      include: []
stages:
  - name: sync
    displayName: Fetch, Trim & Commit
    strategy: naturally
    trigger: auto
    steps:
      - step: shell@agent
        name: sync_databases
        displayName: Sync Community Rules & Steam Workshop Map
        hostGroupID: default
        script: |
          set -e
          if ! command -v dotnet >/dev/null 2>&1; then
            curl -fsSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 10.0 --install-dir "$HOME/.dotnet"
            export PATH="$HOME/.dotnet:$PATH"
          fi
          dotnet run --project tools/PackFrame.DbSync/PackFrame.DbSync.csproj -c Release -- "$(pwd)"
          git config user.name "gitee-go[bot]"
          git config user.email "noreply@gitee.com"
          git add update/communityRules.json update/workshopMap.json.gz app/PackFrame/Assets/CommunityRules.json app/PackFrame/Assets/WorkshopMap.json.gz
          if git diff --cached --quiet; then
            echo "No database changes detected."
          else
            git commit -m "chore(db): sync trimmed RimSort community rules & workshop map"
            if [ -n "${GITEE_TOKEN}" ]; then
              git push "https://${GITEE_USER:-zxuw}:${GITEE_TOKEN}@gitee.com/zxuw/Rimworld-PackFrame.git" HEAD:main
            else
              git push origin HEAD:main
            fi
          fi
