name: Sync RimSort Databases

on:
  schedule:
    # Runs daily at 04:20 UTC
    - cron: '20 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rimsort-dbs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Fetch and trim RimSort Community Rules & Steam Workshop DB
        run: dotnet run --project tools/PackFrame.DbSync/PackFrame.DbSync.csproj -c Release -- "${GITHUB_WORKSPACE}"

      - name: Verify regression checks
        run: dotnet run --project tests/PackFrame.Checks/PackFrame.Checks.csproj -c Release

      - name: Commit and push updates to GitHub
        id: commit_gh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/communityRules.json update/workshopMap.json.gz app/PackFrame/Assets/CommunityRules.json app/PackFrame/Assets/WorkshopMap.json.gz
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No database changes detected."
          else
            git commit -m "chore(db): sync trimmed RimSort community rules & workshop map"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror main branch to Gitee (HTTPS token or SSH key if configured)
        env:
          GITEE_USER: ${{ secrets.GITEE_USER }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_KEY }}
        run: |
          if [ -n "${GITEE_TOKEN}" ]; then
            USER_NAME="${GITEE_USER:-zxuw}"
            git push "https://${USER_NAME}:${GITEE_TOKEN}@gitee.com/zxuw/Rimworld-PackFrame.git" HEAD:main
          elif [ -n "${GITEE_SSH_KEY}" ]; then
            mkdir -p ~/.ssh
            printf '%s\n' "${GITEE_SSH_KEY}" > ~/.ssh/gitee_key
            chmod 600 ~/.ssh/gitee_key
            ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts 2>/dev/null
            GIT_SSH_COMMAND="ssh -i ~/.ssh/gitee_key -o StrictHostKeyChecking=yes" git push "git@gitee.com:zxuw/Rimworld-PackFrame.git" HEAD:main
            rm -f ~/.ssh/gitee_key
          else
            echo "GITEE_TOKEN / GITEE_SSH_KEY secret not set; skipping automatic Gitee push from GitHub Actions."
          fi
