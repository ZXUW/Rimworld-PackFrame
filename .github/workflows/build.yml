name: Build and regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build tests/PackFrame.Checks/PackFrame.Checks.csproj -c Release
      - run: dotnet run --project tests/PackFrame.Checks/PackFrame.Checks.csproj -c Release --no-build
